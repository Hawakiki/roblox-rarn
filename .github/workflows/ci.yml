name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

# 같은 브랜치에 새 푸시가 오면 앞선 실행을 취소한다. 이미 뒤집힌 커밋의 결과를 기다리는
# 것보다, 지금 밀어넣은 것의 답을 빨리 받는 쪽이 항상 쓸모 있다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 관례를 규칙으로 바꾼다. 테스트는 전부 fetch 를 주입해서 이미 오프라인이지만, 그건
  # 누군가 기억하는 동안에만 유지되는 성질이다. 실제 요청을 하나 넣은 테스트는 로컬에서
  # 통과하고 리뷰도 통과한 뒤, api.wally.run 이 흔들리는 날 CI 로만 나타난다.
  # 이걸 켜 두면 그 테스트는 그 자리에서 RN0130 으로 죽는다.
  RARN_NO_NETWORK: '1'
  # 훅은 로컬 개발용이다. CI 는 이미 같은 검사를 잡으로 돌린다.
  HUSKY: '0'

jobs:
  # master 로 들어가는 문은 release/* 와 hotfix/* 두 개뿐이다. `.husky/branch-guard.sh`
  # 가 같은 규약을 지키지만 그것은 *커밋할 때 브랜치 이름*만 본다 — PR 의 base 는 보지
  # 않고, 볼 수도 없다. 그래서 feat/* 를 master 로 겨누는 것은 여전히 클릭 한 번 거리다.
  #
  # 지금은 기본 브랜치가 develop 이라 그 클릭이 잘 일어나지 않는다. 그것은 규칙이 아니라
  # 사고를 막아 주는 우연이고, 기본 브랜치를 master 로 바꾸는 순간 사라진다. 바꾸기 전에
  # 우연을 규칙으로 옮겨 둔다.
  #
  # 빨간 X 로 보일 뿐 자동으로 막지는 않는다. 실제로 막으려면 이 잡을 master 의 브랜치
  # 보호에서 required 로 지정해야 하고, 그것은 저장소 설정이다.
  base:
    name: PR base
    if: github.event_name == 'pull_request' && (github.base_ref == 'master' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: master 로 오는 PR 은 release/* 나 hotfix/* 여야 한다
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$HEAD_REF" in
            release/*|hotfix/*)
              echo "ok  $HEAD_REF -> $BASE_REF"
              ;;
            *)
              echo "✗ $HEAD_REF 를 $BASE_REF 로 보낼 수 없다." >&2
              echo >&2
              echo "  $BASE_REF 에는 두 갈래로만 들어간다:" >&2
              echo "    버전 올리기    develop 에서 release/<version> 을 딴다" >&2
              echo "    나간 버전 수리  master 에서 hotfix/* 를 딴다" >&2
              echo >&2
              echo "  평범한 작업이라면 base 를 develop 으로 바꾸면 된다." >&2
              exit 1
              ;;
          esac

  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 윈도우만 깨졌는데 리눅스까지 취소되면, 플랫폼 문제인지 공통 문제인지 판단할
      # 근거가 사라진다. 판단 근거를 아끼자고 몇 분을 아끼는 거래는 남는 게 없다.
      fail-fast: false
      matrix:
        # 윈도우를 뺄 수 없다. `renameIntoPlace` 는 "윈도우는 기존 경로 위로 rename
        # 하지 못한다" 는 사실 위에 서 있고, 리눅스에서만 도는 CI 는 그 분기를 한 번도
        # 밟지 않는다. 반대로 개발 기계가 윈도우라, 검증이 없던 쪽은 리눅스다.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # 고정한다. pre-commit 훅이 쓰는 것과 같은 버전이어야, CI 가 빨개졌을 때
          # 그게 코드 탓인지 아무도 고르지 않은 Bun 업그레이드 탓인지 묻지 않아도 된다.
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # 두 테스트가 도구 없이는 스스로 건너뛴다. 건너뛰게 두면 CI 가 로컬보다 약해지고,
      # 하필 그 둘이 파일 트리로는 볼 수 없는 것을 보는 테스트다 — lune 은 한 패키지와
      # 그 사본 두 개의 차이를, rojo 는 파생한 DataModel 경로가 실제로 맞는지를.
      - uses: ./.github/actions/roblox-tools

      # format -> lint -> typecheck -> test. 훅이 돌리는 것과 같은 명령이다.
      - run: bun run check

  build:
    name: build (${{ matrix.target.name }})
    needs: check
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        # 축은 *타깃* 이고, 러너는 원래 하나여야 했다 — "한 호스트에서 셋이 다 나온다"
        # 는 CI 가 매번 재확인할 주장이었기 때문이다. 그 재확인이 첫 판에 값을 했다.
        #
        # ubuntu 에서 만든 윈도우 바이너리는 `--version` 에서 세그폴트로 죽는다.
        # 같은 호스트에서 나온 darwin-arm64 는 macOS 에서 정상이고, --bytecode 만
        # 뺀 대조군은 윈도우에서 여섯 검사를 전부 통과했다. 즉 깨지는 조합은
        # "윈도우로 크로스컴파일 + --bytecode" 하나다. bytecode 는 시작 시간을
        # 178ms -> 152ms 로 줄여 주고, 하필 윈도우가 Roblox 개발자가 가장 많이 쓰는
        # 플랫폼이라 그쪽을 느리게 만드는 대신 그쪽만 네이티브로 짓는다.
        #
        # Bun 이 고치면 windows-x64 를 ubuntu 로 되돌리면 된다. 그때 알려 주는 것은
        # 이 주석이 아니라 smoke 잡이다.
        target:
          - { name: windows-x64, runner: windows-latest, script: build:windows, file: rarn-windows-x64.exe }
          - { name: macos-arm64, runner: ubuntu-latest, script: build:macos-arm64, file: rarn-macos-arm64 }
          - { name: linux-x64, runner: ubuntu-latest, script: build:linux-x64, file: rarn-linux-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      # package.json 의 스크립트를 그대로 부른다. 플래그를 여기 옮겨 적으면 로컬 빌드와
      # CI 빌드가 언젠가 다른 것을 만들게 되고, 그 차이는 릴리스에서야 드러난다.
      - run: bun run ${{ matrix.target.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: rarn-${{ matrix.target.name }}
          path: dist/${{ matrix.target.file }}
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: smoke (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # 윈도우 러너의 기본 셸은 pwsh 다. bash 로 고정하면 세 OS 가 스크립트 하나를
        # 공유하고, 스모크 내용이 플랫폼마다 갈라지지 않는다.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # 여기 축은 *러너 OS* 다. build 와 합치고 싶어지지만, 합치면 셋 다 네이티브
        # 빌드가 되어 남아 있는 크로스컴파일 검증(darwin-arm64, linux-x64)까지 사라진다.
        #
        # 빌드 성공은 동작 보장이 아니다. ubuntu 가 만든 darwin 바이너리는 ubuntu 에서
        # 실행조차 되지 않으므로, 만든 곳에서 확인하면 아무것도 확인한 게 아니다.
        # 이 잡이 없었으면 세그폴트하는 윈도우 바이너리가 빌드 성공으로 통과했다.
        #
        # macOS 만 버전을 못박는다. 여기서 검증하는 아티팩트는 bun-darwin-arm64 이고,
        # arm64 Mach-O 는 x64 러너에서 실행 자체가 안 된다 — Rosetta 는 반대 방향이다.
        # `macos-latest` 는 지금 arm64 를 가리키지만 그건 GitHub 이 바꿀 수 있는 값이라,
        # 이 잡의 전제를 남의 기본값에 맡기지 않는다. `macos-26` 은 arm64 로 고정이다.
        # (`macos-14` 는 deprecated 됐다.)
        include:
          - { os: windows-latest, artifact: rarn-windows-x64, bin: rarn-windows-x64.exe }
          - { os: macos-26, artifact: rarn-macos-arm64, bin: rarn-macos-arm64 }
          - { os: ubuntu-latest, artifact: rarn-linux-x64, bin: rarn-linux-x64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

      # 아티팩트는 실행 권한을 보존하지 않는다.
      - run: chmod +x "dist/${{ matrix.bin }}"

      - run: bash scripts/smoke.sh "dist/${{ matrix.bin }}"

# 릴리스는 release.yml 에 있고, 태그로만 돈다.
