name: Release

# 태그로만 돈다. 릴리스는 되돌릴 수 없는 종류의 일이고, 푸시나 PR 로 실행될 수 있는
# 자리에 두면 언젠가 의도치 않게 한 번 돈다.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RARN_NO_NETWORK: '1'
  HUSKY: '0'

jobs:
  # 릴리스 전에 다시 검사한다. CI 가 이미 develop 에서 돌았지만, 태그가 가리키는
  # 커밋이 그때 검사된 것과 같다는 보장은 없다.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # ci.yml 과 같은 이유로 깐다. 릴리스 직전 검사가 평소보다 약하면 곤란하다.
      - uses: ./.github/actions/roblox-tools
      - run: bun run check

  build:
    name: build (${{ matrix.target.name }})
    needs: check
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        # ci.yml 과 같은 이유로 윈도우만 네이티브다: ubuntu 에서 크로스컴파일한
        # 윈도우 바이너리는 --bytecode 와 함께 시작하자마자 세그폴트한다.
        target:
          - { name: windows-x86_64, runner: windows-latest, script: build:windows, file: rarn-windows-x64.exe, exe: rarn.exe }
          - { name: macos-aarch64, runner: ubuntu-latest, script: build:macos-arm64, file: rarn-macos-arm64, exe: rarn }
          - { name: linux-x86_64, runner: ubuntu-latest, script: build:linux-x64, file: rarn-linux-x64, exe: rarn }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.target.script }}

      # 스모크는 만든 곳에서 돌 수 있을 때만 의미가 있다. 윈도우 바이너리는 윈도우
      # 러너에서 만들므로 여기서 확인되고, 나머지 둘은 ci.yml 의 smoke 잡이 본다.
      - if: matrix.target.runner == 'windows-latest'
        shell: bash
        run: bash scripts/smoke.sh "dist/${{ matrix.target.file }}"

      # 이름 규칙은 Rokit 이 정한다. lib/descriptor 가 파일명에서 OS 와 아키텍처를
      # 문자열로 찾아내며, `windows`/`macos`/`linux` 와 `x86_64`/`aarch64` 가 전부
      # 그 목록에 있다. lune·rojo·rokit 자신이 쓰는 형태와 같다.
      #
      # zip 안의 파일 이름은 `rarn`(.exe) 이다. Rokit 은 도구 이름과의 일치를 요구하지
      # 않고 6개 항목으로 점수를 매겨 가장 높은 것을 고르는데, 실행 확장자와 실행 파일
      # 내용만으로도 0점이 아니고 아카이브에 실행파일이 하나뿐이면 그것이 이긴다.
      # 사람이 직접 받아서 압축을 풀었을 때 나오는 이름이기도 하다.
      - name: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp "dist/${{ matrix.target.file }}" "${{ matrix.target.exe }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "release/rarn-$version-${{ matrix.target.name }}.zip" "${{ matrix.target.exe }}" > /dev/null
          else
            chmod +x "${{ matrix.target.exe }}"
            zip -q "release/rarn-$version-${{ matrix.target.name }}.zip" "${{ matrix.target.exe }}"
          fi
          ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target.name }}
          path: release/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rokit 스펙의 버전에는 v 가 없다: 태그가 v0.1.0 이면 스펙은 @0.1.0 이다.
      - id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - shell: bash
        run: ls -la release/

      # 초안으로 만든다. 사람이 자산을 눈으로 보고 게시하는 단계를 하나 남겨 두는 쪽이,
      # 태그를 밀자마자 공개되는 것보다 낫다 - 릴리스는 지울 수 있지만 이미 받아 간
      # 사람의 rokit.toml 은 지울 수 없다.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release/*.zip
          body: |
            ## 설치

            ```toml
            # rokit.toml
            [tools]
            rarn = "Hawakiki/roblox-rarn@${{ steps.version.outputs.value }}"
            ```

            또는 아래 자산을 직접 받아 PATH 에 두면 된다.
