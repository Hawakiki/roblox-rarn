    about: 버그가 아니어도 좋습니다. 한 줄이면 됩니다 — 밖에서는 아무도 안 쓰는 것과 쓰면서 말 안 하는 것이 똑같아 보입니다.

  - name: 왜 이렇게 만들었나 / Why it works this way
    url: https://github.com/Hawakiki/roblox-rarn/blob/develop/CLAUDE.md
    about: 이상해 보이는 결정에는 대개 측정값이 붙어 있습니다. 이슈를 쓰기 전에 한 번 보시면 답이 있을 수도 있습니다.

  - name: 알려진 문제 / Known issues
    url: https://github.com/Hawakiki/roblox-rarn/blob/develop/docs/known-issues.md
