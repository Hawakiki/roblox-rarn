# 빈 이슈를 막지는 않는다. 템플릿에 맞지 않는 보고가 안 올라오는 것보다는,
# 형식 없이라도 올라오는 쪽이 낫다.
#
# Blank issues stay enabled on purpose: a report that does not fit a template is
# still worth more than a report nobody sent.
blank_issues_enabled: true

contact_links:
